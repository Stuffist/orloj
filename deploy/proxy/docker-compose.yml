# SPECIFIC TO ORLOJ.TOP: reverse proxy of the author's VPS (Caddy), ports 80/443 (and 8443 for
# Olomòc's old addresses), shared with another project (B5T). Not needed to run Orloj elsewhere.
# Routing by host name and certificates: Caddyfile. On the VPS: /var/www/proxy/.
#
#   docker network create web                        (once per machine)
#   docker compose up -d
#   docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile   (Caddyfile changed)

services:
  caddy:
    image: caddy:2.10-alpine
    container_name: caddy
    restart: always
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"         # HTTP/3
      - "8443:8443"           # Olomòc's old addresses: redirect
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and keys obtained by Caddy: to keep (otherwise requested again at startup).
      - ./caddy-data:/data
      - ./caddy-config:/config
    networks: [web]

networks:
  web:
    external: true
