# Fichiers de l'app, inclus par chaque serveur de default.conf.template.
# __BASE_PATH__ est remplacé à la construction de l'image.

root /usr/share/nginx/html;

# Redirections relatives : le port public (ex. 8443) diffère du port interne (443).
absolute_redirect off;
server_tokens off;

# Fichiers .gz produits par la publication (_framework) ; compression à la volée pour le reste.
gzip_static on;
gzip on;
gzip_types application/json text/css application/javascript image/svg+xml;
gzip_min_length 1024;

location __BASE_PATH__ {
    # Routes de l'app (pas de fichier correspondant) : index.html, le routeur Blazor prend le relais.
    try_files $uri $uri/ __BASE_PATH__index.html;
    # Revalidation à chaque chargement : un redéploiement (données, traductions) est vu aussitôt.
    # Les fichiers inchangés répondent 304 ; Blazor met en cache _framework par empreinte.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
}
