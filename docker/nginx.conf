# Service des fichiers statiques de l'app Blazor WebAssembly.
# __BASE_PATH__ est remplacé à la construction de l'image (ARG BASE_PATH du Dockerfile).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Derrière le reverse proxy : redirections relatives (sans hôte ni port internes).
    absolute_redirect off;
    server_tokens off;

    # Fichiers .gz produits par la publication (_framework) ; compression à la volée pour le reste.
    gzip_static on;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        return 302 __BASE_PATH__;
    }

    location __BASE_PATH__ {
        # Routes de l'app (pas de fichier correspondant) : index.html, le routeur Blazor prend le relais.
        try_files $uri $uri/ __BASE_PATH__index.html;
        # Revalidation à chaque chargement : un redéploiement (données, traductions) est vu aussitôt.
        # Les fichiers inchangés répondent 304 ; Blazor met en cache _framework par empreinte.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
