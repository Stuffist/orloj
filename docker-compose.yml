# Olomòc sur le VPS : https://orloj.top/ (→ /builder/ ; tournois sous /pairings/), derrière le
# reverse proxy Caddy (deploy/proxy), qui tient les ports 80/443 et les certificats. Le conteneur
# n'ouvre aucun port public : Caddy le joint par le réseau Docker « web ».
#
#   docker network create web                        (une fois par machine)
#   docker compose up -d --build                     (depuis les sources)
#   docker compose pull && docker compose up -d      (image publiée sur Docker Hub)

services:
  olomoc:
    image: stuffist/olomoc
    build: .
    container_name: olomoc
    restart: always
    # Durcissement : utilisateur sans privilèges (Dockerfile), aucune capacité, pas d'élévation
    # possible, système de fichiers en lecture seule hormis /data et /tmp.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      # Noms acceptés (les autres : erreur 400) ; localhost / 127.0.0.1 : healthcheck, diagnostic.
      AllowedHosts: ${OLOMOC_HOSTS:-orloj.top;localhost;127.0.0.1}
      # Adresse IP et schéma (https) du visiteur, transmis par Caddy (X-Forwarded-For / -Proto) :
      # limites de requêtes par visiteur, HSTS. Le port 8080 n'est joignable que par le proxy.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    ports:
      # HTTP local au VPS uniquement (diagnostic) : curl http://127.0.0.1:8090/healthz
      - "127.0.0.1:${OLOMOC_HTTP_PORT:-8090}:8080"
    volumes:
      # Tournois : un fichier JSON par tournoi dans ./data, à côté de ce fichier (créé au premier
      # démarrage). Conservé par down/up/--force-recreate/--build ; à sauvegarder comme un dossier.
      # Doit appartenir à l'utilisateur du conteneur : sudo chown -R 1654:1654 data
      - ./data:/data
    networks: [web]

networks:
  web:
    external: true
