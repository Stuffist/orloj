# Olomòc sur le VPS, de façon autonome : https://<DOMAIN>:<OLOMOC_HTTPS_PORT>/ (→ /builder/ ;
# tournois sous /pairings/)
# Indépendant des autres projets (B5T garde 80/443) ; réutilise le certificat Let's Encrypt
# de l'hôte, monté en lecture seule. Réglages facultatifs dans un fichier .env à côté.
#
#   docker compose up -d --build                     (depuis les sources)
#   docker compose pull && docker compose up -d      (image publiée sur Docker Hub)

services:
  olomoc:
    image: stuffist/olomoc
    build: .
    container_name: olomoc
    restart: always
    # Durcissement : aucun privilège root superflu (capacités retirées, sauf l'ouverture des ports
    # 80/443), pas d'élévation possible, système de fichiers en lecture seule hormis /data et /tmp.
    # L'utilisateur reste root pour lire la clé privée de Let's Encrypt (réservée à root sur l'hôte).
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    environment:
      DOMAIN: ${DOMAIN:-orloj.top}
      # Autres noms, redirigés vers DOMAIN (même chemin, même port) ; tous dans le certificat.
      DOMAIN_ALIASES: ${DOMAIN_ALIASES-www.orloj.top;vps-24cf4978.vps.ovh.net}
      # Dossier du certificat dans /etc/letsencrypt/live/ (vide : DOMAIN).
      CERT_NAME: ${CERT_NAME-vps-24cf4978.vps.ovh.net}
    ports:
      - "${OLOMOC_HTTPS_PORT:-8443}:443"
      # HTTP local au VPS uniquement (diagnostic) : curl http://127.0.0.1:8090/
      - "127.0.0.1:${OLOMOC_HTTP_PORT:-8090}:80"
    volumes:
      # Tout /etc/letsencrypt : live/ contient des liens vers archive/.
      - ${CERT_ROOT:-/etc/letsencrypt}:/etc/letsencrypt:ro
      # Tournois : un fichier JSON par tournoi dans ./data, à côté de ce fichier (créé au premier
      # démarrage). Conservé par down/up/--force-recreate/--build ; à sauvegarder comme un dossier.
      - ./data:/data
